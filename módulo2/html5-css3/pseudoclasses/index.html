<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudoclasses</title>
    <style>
        div{
            display: inline-block;
            background-color: #04052e;
            text-align: center;
            height: 100px;
            width: 200px;
            margin: auto;
            transition: background-color 0.4s;
            padding-top: 80px;
            color: aliceblue;
            cursor: pointer;
        }
        
        div:hover{
            background-color: blue;
        }
    </style>
</head>
<body>
    <div id="d1">1</div>
    <div id="d2">2</div>
    <div id="d3">3</div>
</body>
</html>
