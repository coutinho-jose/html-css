    <title>Links</title>
    <style>
      body {
        background-color: #606c38;
      }

      a {
        color: #fefae0;
        text-decoration: none;
        transition:
          border-bottom 0.4s,
          color 0.4s;
      }

      a:hover {
        border-bottom: 1px solid blue;
        color: aquamarine;
      }

      /* a::after{
        content: 'link';
        text-decoration: none;
        color: grey;
      } */

      a:active {
        color: aqua;
      }

      a:visited {
        color: rgb(4, 0, 255);
      }
    </style>
  </head>
  <body>
    <h1>Personalizando Links</h1>
